name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Installer Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: Compiler l'APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: renommeur-apk
          path: bin/*.apk
